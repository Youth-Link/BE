name: YouthLink CI/CD 파이프라인

on:
  push:
    branches: [ "develop", "main" ] # 두 브랜치 모두 감시

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle로 프로젝트 빌드 (CI)
        run: ./gradlew build -x test

      # -----------------------------------------------------------
      # 아래 단계들은 'main' 브랜치에 푸시되었을 때만 실행 (CD)
      # -----------------------------------------------------------

      - name: 도커 허브 로그인
        if: github.ref == 'refs/heads/main' # 조건문 추가
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/youthlink-be .
          docker push ${{ secrets.DOCKER_USERNAME }}/youthlink-be

      - name: EC2 서버 접속 및 배포 (CD)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/youthlink-be
            ./deploy.sh