    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
    chroma:
      store:
        collection-name: youth_policies
      client:
        host: localhost
        port: 8000

youth-center:
  api:
    url: https://www.youthcenter.go.kr/go/ythip/getPlcy
    key: ${YOUTH_CENTER_API_KEY}