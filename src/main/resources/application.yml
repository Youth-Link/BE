spring:
  profiles:
    active: local
  application:
    name: youth-link

  datasource:
    url: jdbc:mysql://localhost:3306/youth_link?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - account_email
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
    vectorstore:
      chroma:
        collection-name: youth_policies
        initialize-schema: true   # 컬렉션 없으면 자동 생성
        client:
          host: localhost
          port: 8000

youth-center:
  api:
    url: https://www.youthcenter.go.kr/go/ythip/getPlcy
    key: ${YOUTH_CENTER_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000 # 1 hour
  refresh-token-expiration: 1209600000 # 14 days
  oauth2-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}