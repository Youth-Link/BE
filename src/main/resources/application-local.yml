spring:
  application:
    name: youth-link

  datasource:
    url: jdbc:h2:mem:youth_link;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.H2Dialect

  autoconfigure:
    exclude: org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration

  # Security OAuth2 비활성화
  security:
    oauth2:
      client:
        registration: {}

  ai:
    google:
      genai:
        api-key: test-key
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          api-key: test-key
          options:
            model: text-embedding-004
    vectorstore:
      chroma:
        collection-name: youth_policies
        initialize-schema: true   # 컬렉션 없으면 자동 생성
        client:
          host: http://localhost
          port: 8000

youth-center:
  api:
    url: https://www.youthcenter.go.kr/go/ythip/getPlcy
    key: test-key

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
