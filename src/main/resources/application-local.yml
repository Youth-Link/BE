spring:
  application:
    name: youth-link

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration

  # Spring AI 로컬 설정 (더미 API 키 - 실제 테스트 시 실제 키로 교체)
  ai:
    google:

      genai:
        api-key: ${GEMINI_API_KEY:dummy-key}
        chat:
          options:
            model: gemini-2.0-flash

  datasource:
    url: jdbc:h2:mem:youth_link;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.H2Dialect

  # Security OAuth2 비활성화
  security:
    oauth2:
      client:
        registration: {}

youth-center:
  api:
    url: https://www.youthcenter.go.kr/go/ythip/getPlcy
    key: test-key

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
